version: "3.9"

services:

  # ── Knowledge Graph
  neo4j:
    image: neo4j:5-community
    container_name: ecdt-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USER}/${NEO4J_PASSWORD}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
    ports:
      - "7474:7474"   # Neo4j Browser (HTTP)
      - "7687:7687"   # Bolt
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Digital Twin — Time Series
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: ecdt-timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${TIMESCALE_USER:-ecdt}
      POSTGRES_PASSWORD: ${TIMESCALE_PASSWORD:-ecdt}
      POSTGRES_DB: ${TIMESCALE_DB:-ecdt}
    ports:
      - "5432:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TIMESCALE_USER:-ecdt}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── RAG & Agent Mémoire — base vectorielle
  chroma:
    image: chromadb/chroma:latest
    container_name: ecdt-chroma
    restart: unless-stopped
    environment:
      IS_PERSISTENT: "TRUE"
      PERSIST_DIRECTORY: /chroma/chroma_data
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma_data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/heartbeat || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Backend — API FastAPI + orchestrateur d agents
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: ecdt-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NEO4J_URI: bolt://neo4j:7687
      TIMESCALE_URI: postgresql://${TIMESCALE_USER:-ecdt}:${TIMESCALE_PASSWORD:-ecdt}@timescaledb:5432/${TIMESCALE_DB:-ecdt}
      CHROMA_HOST: chroma
      CHROMA_PORT: 8000
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
      - ./data:/app/data
    depends_on:
      neo4j:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
      chroma:
        condition: service_healthy
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000 --reload

  # ── Frontend — Dashboard Next.js
  frontend:
    build:
      context: ./frontend
      dockerfile: ../Dockerfile.frontend
    container_name: ecdt-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    command: npm run dev

volumes:
  neo4j_data:
  neo4j_logs:
  timescale_data:
  chroma_data:
